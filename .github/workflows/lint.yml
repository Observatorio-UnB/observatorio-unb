name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Erros reais (pyflakes, sintaxe, imports fora de ordem); configuração em ruff.toml.
      - name: "Ruff"
        run: pipx run ruff==0.17.5 check .

  tamanho-arquivos:
    runs-on: ubuntu-latest
    env:
      LIMITE_KB: 1024
    steps:
      - uses: actions/checkout@v4

      # Barra arquivos versionados acima do limite (imagens, esquemas, dumps), que deixam o
      # clone lento. Dado grande vai para o banco ou para artefato do workflow, não para o git.
      - name: "Tamanho máximo de arquivos versionados"
        run: |
          grandes=$(git ls-files -z | xargs -0 du -k | awk -v lim="$LIMITE_KB" '$1 > lim')
          if [ -n "$grandes" ]; then
            echo "::error::Arquivos acima de ${LIMITE_KB} KB:"
            echo "$grandes"
            exit 1
          fi
          echo "Nenhum arquivo acima de ${LIMITE_KB} KB."

  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt coverage

      # Só os testes que não precisam de banco nem de Kafka (tests/test_unit_*): CDC (MERGE
      # idempotente no Delta), lake, dado atrasado, 3NF/Star, busca, freshness, leitura do INEP,
      # grafo do Dagster (pulado sem o Dagster instalado) e a resposta da E1. Os de banco rodam no
      # medalhao.yml.
      - name: "Testes unitários"
        run: |
          coverage run --source=src -m unittest discover -s tests -p "test_unit_*.py"
          coverage report --skip-empty --fail-under=50
