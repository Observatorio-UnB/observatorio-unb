name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tamanho-arquivos:
    runs-on: ubuntu-latest
    env:
      LIMITE_KB: 1024
    steps:
      - uses: actions/checkout@v4

      # Barra arquivos versionados acima do limite (imagens, esquemas, dumps), que deixam o
      # clone lento. Dado grande vai para o banco ou para artefato do workflow, não para o git.
      - name: "Tamanho máximo de arquivos versionados"
        run: |
          grandes=$(git ls-files -z | xargs -0 du -k | awk -v lim="$LIMITE_KB" '$1 > lim')
          if [ -n "$grandes" ]; then
            echo "::error::Arquivos acima de ${LIMITE_KB} KB:"
            echo "$grandes"
            exit 1
          fi
          echo "Nenhum arquivo acima de ${LIMITE_KB} KB."

  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Só os testes que não precisam de banco nem de Kafka: CDC (MERGE idempotente no Delta),
      # lago, dado atrasado e 3NF/Star. Os de banco rodam no medalhao.yml.
      - name: "Testes unitários"
        run: python -m unittest discover -s tests -p "test_unit_*.py"
