name: Medalhão + Pages

# Bronze -> Silver -> Gold a cada execução (prova o pipeline "roda do zero")
# e publica o dashboard no GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # toda segunda 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: "Bronze — ingestão via API CKAN"
        env:
          SKIP_DATASETS: sigaa # não é consumido por nenhuma etapa
        run: python src/ingestion/ckan_client.py

      - name: "Bronze — Censo da Educação Superior (INEP)"
        run: python src/ingestion/inep_censo_superior.py

      - name: "Silver — limpeza, tipagem e normalização"
        run: python src/pipeline/transform_silver.py

      - name: "Gold — tabela analítica + join heterogêneo"
        run: python src/pipeline/build_gold.py

      - name: "Auditoria de qualidade"
        run: python src/audit/quality_auditor.py

      - name: "Privacidade — k-anonimato (LGPD)"
        run: python src/privacy/lgpd_check.py

      - name: "Verificação determinística (contratos da Gold)"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: "Resumo do medalhão"
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json, glob, os

          def rows(path):
              with open(path, newline="", encoding="utf-8", errors="replace") as f:
                  return sum(1 for _ in f) - 1

          print("## Camadas do medalhão\n")
          print("| Camada | Arquivo | Linhas |")
          print("|---|---|---|")
          for layer in ("bronze", "silver", "gold"):
              for p in sorted(glob.glob(f"data/{layer}/*.csv")):
                  print(f"| {layer} | `{os.path.basename(p)}` | {rows(p):,} |")

          with open("data/gold/relatorio_casamento_joins.json", encoding="utf-8") as f:
              taxa = json.load(f).get("taxa_de_casamento_pct")
          import pandas as pd
          g = pd.read_csv("data/gold/retencao_cursos_unb.csv")
          print(f"\n- Taxa de casamento dos joins: **{taxa}%**")
          print(f"- Menor grupo publicado (k-anonimato): **{int(g['total_discentes_registrados'].min())}** discentes")
          PY

      - name: "Empacota dados públicos para o site"
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          retention-days: 1
          if-no-files-found: error
          path: |
            data/gold/
            docs/relatorio_qualidade.md
            docs/registro_privacidade_lgpd.md
            docs/challenge_canvas.md
            docs/caderno_analise.md
            docs/datasheet_gold.md
            docs/dicionario_dados_gold.md
            docs/analise_social_pibic.md

  deploy:
    needs: pipeline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: artifact

      - name: "Monta _site/"
        run: |
          mkdir -p _site/app/src/dashboard/assets _site/app/data _site/app/docs
          cp site/index.html _site/index.html
          cp src/dashboard/app.py _site/app/src/dashboard/app.py
          cp -r src/dashboard/assets/* _site/app/src/dashboard/assets/ 2>/dev/null || true
          cp -r artifact/data/gold _site/app/data/gold
          cp artifact/docs/*.md _site/app/docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
