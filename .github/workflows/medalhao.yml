name: Medalhão + Pages

# Bronze -> Silver -> Gold a cada execução (prova o pipeline "roda do zero")
# e publica o dashboard no GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # toda segunda 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: observatorio
          POSTGRES_DB: observatorio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatorio -d observatorio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://observatorio:observatorio@localhost:5432/observatorio
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Cada etapa lê a camada anterior do banco e grava a sua nele: não há CSV
      # intermediário, e bronze/silver (dado pessoal) nunca saem do runner.
      - name: "Banco — migrações do esquema (PostgreSQL)"
        run: python src/db/migrar.py

      - name: "Bronze — ingestão via API CKAN"
        run: python src/ingestion/ckan_client.py

      - name: "Bronze — Censo da Educação Superior (INEP)"
        run: python src/ingestion/inep_censo_superior.py

      - name: "Silver — limpeza, tipagem e normalização"
        run: python src/pipeline/transform_silver.py

      - name: "Gold — tabela analítica + join heterogêneo"
        run: python src/pipeline/build_gold.py

      - name: "Auditoria de qualidade"
        run: python src/audit/quality_auditor.py

      - name: "Privacidade — k-anonimato (LGPD)"
        run: python src/privacy/lgpd_check.py

      - name: "Cache do modelo de embedding"
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2

      - name: "Busca semântica — vetorização (pgvector)"
        env:
          # Os ~12,5 mil planos de IC levam vários minutos em CPU; no CI basta provar o fluxo.
          VETORIZAR_TIPOS: curso,documentacao
        run: python src/busca/vetorizar.py

      - name: "Dicionário de dados do banco"
        run: python src/db/gerar_dicionario.py

      - name: "Verificação determinística (contratos da Gold)"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: "Resumo do medalhão"
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          sys.path.insert(0, ".")
          from src.db.tabelas import consultar, ler_relatorio

          print("## Camadas do medalhão (PostgreSQL)\n")
          print("| Camada | Tabela | Linhas |")
          print("|---|---|---|")
          tabelas = consultar(
              "SELECT table_schema, table_name FROM information_schema.tables "
              "WHERE table_schema IN ('bronze', 'silver', 'gold') AND table_type = 'BASE TABLE' "
              "ORDER BY array_position(ARRAY['bronze', 'silver', 'gold'], table_schema::text), table_name"
          )
          for esquema, nome in tabelas.values.tolist():
              total = consultar(f'SELECT count(*) AS n FROM "{esquema}"."{nome}"').iloc[0]["n"]
              print(f"| {esquema} | `{esquema}.{nome}` | {total:,} |")

          taxa = ler_relatorio("relatorio_casamento_joins")["taxa_de_casamento_pct"]
          k = consultar("SELECT min(total_discentes_registrados) AS k FROM gold.retencao_cursos_unb").iloc[0]["k"]
          print(f"\n- Taxa de casamento dos joins: **{taxa}%**")
          print(f"- Menor grupo publicado (k-anonimato): **{k}** discentes")
          PY

      - name: "Export estático da gold para o GitHub Pages"
        run: python src/db/exportar_gold.py

      - name: "Empacota dados públicos para o site"
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          retention-days: 1
          if-no-files-found: error
          path: |
            export/gold.json
            docs/relatorio_qualidade.md
            docs/registro_privacidade_lgpd.md
            docs/challenge_canvas.md
            docs/caderno_analise.md
            docs/datasheet_gold.md
            docs/dicionario_dados_gold.md
            docs/analise_social_pibic.md

  deploy:
    needs: pipeline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: artifact

      - name: "Monta _site/"
        run: |
          mkdir -p _site/app/src/dashboard/assets _site/app/export _site/app/docs
          cp site/index.html _site/index.html
          cp src/dashboard/app.py _site/app/src/dashboard/app.py
          cp -r src/dashboard/assets/* _site/app/src/dashboard/assets/ 2>/dev/null || true
          cp artifact/export/gold.json _site/app/export/gold.json
          cp artifact/docs/*.md _site/app/docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
