# Plataforma do Observatório UnB.
#
#   docker compose up -d db        -> só o banco (para rodar o pipeline pelo .venv)
#   docker compose up --build      -> banco + pipeline completo + painel em http://localhost:8501
#   docker compose --profile cdc up -d db kafka connect
#                                  -> banco + Kafka + Debezium para a captura de mudanças (scripts/cdc.sh)
#
# O banco é PostgreSQL 16 com a extensão pgvector (busca semântica). A porta do
# host é 5435 por padrão para não colidir com um PostgreSQL local na 5432.

services:
  db:
    image: pgvector/pgvector:pg16
    # wal_level=logical deixa o Debezium decodificar o WAL. max_slot_wal_keep_size limita o WAL que
    # um slot de replicação abandonado (conector parado) pode reter: passado o limite, o slot é
    # invalidado, e não o disco que enche.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Roda o medalhão do zero (API CKAN e INEP -> bronze -> silver -> gold ->
  # vetorização) e termina. Cada camada vai direto para o banco: nenhum dado,
  # inclusive o pessoal da bronze e da silver, é gravado na pasta do host.
  pipeline:
    build: .
    command: ["bash", "scripts/rodar_pipeline.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-observatorio}:${POSTGRES_PASSWORD:-observatorio}@db:5432/${POSTGRES_DB:-observatorio}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      FASTEMBED_CACHE_PATH: /cache/fastembed
    volumes:
      - modelos:/cache
    depends_on:
      db:
        condition: service_healthy

  painel:
    build: .
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-observatorio}:${POSTGRES_PASSWORD:-observatorio}@db:5432/${POSTGRES_DB:-observatorio}
      FASTEMBED_CACHE_PATH: /cache/fastembed
    ports:
      - "${PAINEL_PORT:-8501}:8501"
    volumes:
      - modelos:/cache
    depends_on:
      pipeline:
        condition: service_completed_successfully

  # Captura de mudanças (profile cdc): Kafka em modo KRaft, sem ZooKeeper, e Kafka Connect com o
  # conector do Debezium. Os tópicos não têm volume: recriar o container do Kafka apaga o histórico,
  # e o conector refaz o snapshot inicial, que o MERGE idempotente do lago absorve.
  kafka:
    image: apache/kafka:3.7.0
    profiles: ["cdc"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    profiles: ["cdc"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: observatorio-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
    # A porta padrão do Connect (8083) costuma estar ocupada no host.
    ports:
      - "${CONNECT_PORT:-8093}:8083"
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  pgdata:
  modelos:
