<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Observatório de Retenção e Formatura da UnB</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css"
  />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    #boot {
      font: 15px system-ui, sans-serif; color: #334155;
      display: flex; align-items: center; justify-content: center;
      height: 100%; padding: 2rem; text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"><div id="boot">Carregando o painel (Python roda no seu navegador, pode levar ~30s na primeira vez)…</div></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

    // O app.py usa Path(__file__).parent.parent.parent como raiz; com o entrypoint
    // em src/dashboard/app.py, a raiz do filesystem virtual bate com a estrutura abaixo.
    mount(
      {
        entrypoint: "src/dashboard/app.py",
        requirements: ["plotly"], // streamlit, pandas e numpy já vêm no bundle stlite
        files: {
          "src/dashboard/app.py": { url: "./app/src/dashboard/app.py" },
          "src/dashboard/assets/unb_icon.png": { url: "./app/src/dashboard/assets/unb_icon.png" },
          // Modo apresentação (?apresentacao) e os DER que ele exibe.
          "src/dashboard/apresentacao.py": { url: "./app/src/dashboard/apresentacao.py" },
          "src/dashboard/assets/der_silver_3nf.svg": { url: "./app/src/dashboard/assets/der_silver_3nf.svg" },
          "src/dashboard/assets/der_gold_star_schema.svg": { url: "./app/src/dashboard/assets/der_gold_star_schema.svg" },
          // Busca semântica: página do Streamlit multipage, que chama a Edge Function do Supabase.
          "src/dashboard/pages/busca_semantica.py": { url: "./app/src/dashboard/pages/busca_semantica.py" },
          // O navegador não acessa o PostgreSQL: gold e busca vêm do Supabase pela API pública.
          "src/db/supabase_rest.py": { url: "./app/src/db/supabase_rest.py" },
          // Os marcadores são trocados pelo CI (medalhao.yml) com as variáveis SUPABASE_URL e
          // SUPABASE_ANON_KEY do repositório. A chave anon é pública por desenho; o que ela alcança
          // é decidido pelos grants da migração 0018.
          "supabase_config.json": {
            data: JSON.stringify({ url: "__SUPABASE_URL__", anon_key: "__SUPABASE_ANON_KEY__" }),
          },
          // Reserva se o Supabase não responder: gold exportada do banco pelo CI (src/db/exportar_gold.py).
          "export/gold.json": { url: "./app/export/gold.json" },
          "docs/relatorio_qualidade.md": { url: "./app/docs/relatorio_qualidade.md" },
          "docs/analise_social_pibic.md": { url: "./app/docs/analise_social_pibic.md" },
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
