version: 2

# Consumidores da plataforma: o último elo da linhagem. Cada exposure diz o que lê, quem é o dono e o
# que se faz com o dado. Aparecem no grafo do dbt docs (publicado no GitHub Pages em /dbt/) e em
# docs/catalogo/linhagem.md, que liga estes consumidores ao recurso do portal de onde o dado veio.

exposures:
  - name: painel_visao_executiva
    label: "Painel: Visão Executiva (pergunta da E1)"
    type: dashboard
    maturity: high
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: >
      Ranking dos cursos pelo Índice de Retenção Crítica: em quais cursos intervir primeiro. É a
      resposta à pergunta de gestão da E1 (src/dashboard/resposta_e1.py). Os KPIs da UnB vêm do recorte
      UNB da camada semântica; o gráfico de dispersão e os destaques, de gold.retencao_cursos_unb.
    depends_on:
      - ref('painel_cursos_criticos')
      - ref('metricas_por_recorte')
      - source('gold', 'retencao_cursos_unb')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "DEG e coordenações de curso", leitura: "export/gold.json (GitHub Pages) ou banco, papel observatorio_leitura"}

  - name: painel_comparacoes_por_grupo
    label: "Painel: Noturno vs. Diurno, grau e campus"
    type: dashboard
    maturity: high
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: >
      Evasão, formatura e tempo até a formatura por turno, grau e campus, pela camada semântica
      (razão das somas), com a definição versionada de cada métrica (src/dashboard/metricas.py).
    depends_on:
      - ref('metricas_por_recorte')
      - ref('metricas_definicoes')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "DEG", leitura: "export/gold.json ou banco, papel observatorio_leitura"}

  - name: painel_detalhe_e_simulador
    label: "Painel: Detalhe por Curso e Simulador What-If"
    type: dashboard
    maturity: medium
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: >
      Ficha de cada curso e simulação do efeito de reduzir a evasão. O escopo "toda a UnB" do simulador
      usa o recorte UNB da camada semântica.
    depends_on:
      - source('gold', 'retencao_cursos_unb')
      - source('gold', 'retencao_cursos_coorte')
      - ref('metricas_por_recorte')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "DEG e coordenações de curso", leitura: "export/gold.json ou banco, papel observatorio_leitura"}

  - name: painel_alunos_ativos
    label: "Painel: Alunos Ativos"
    type: dashboard
    maturity: medium
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: Alunos ativos hoje por curso e quantos já passaram do prazo ideal.
    depends_on:
      - source('gold', 'ativos_hoje_cursos_unb')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "Coordenações de curso", leitura: "export/gold.json ou banco, papel observatorio_leitura"}

  - name: painel_pibic
    label: "Painel: PIBIC e Inclusão Social na Ciência"
    type: dashboard
    maturity: medium
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: Iniciação científica por curso e perfil social, e a relação com a evasão do curso.
    depends_on:
      - source('gold', 'pibic_social_unb')
      - source('gold', 'retencao_cursos_unb')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "Decanato de Pesquisa e DEG", leitura: "export/gold.json ou banco, papel observatorio_leitura"}

  - name: painel_benchmark_inep
    label: "Painel: Benchmark Nacional (INEP)"
    type: dashboard
    maturity: medium
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: Cada curso da UnB contra os cursos equivalentes das universidades federais (Censo 2019).
    depends_on:
      - source('gold', 'inep_benchmark_cursos_unb')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "DEG", leitura: "export/gold.json ou banco, papel observatorio_leitura"}

  - name: painel_auditoria
    label: "Painel: Auditoria e Qualidade de Dados"
    type: dashboard
    maturity: medium
    url: https://observatorio-unb.github.io/observatorio-unb/
    description: >
      Regras de harmonização dos nomes de curso e quantos vínculos cada uma afeta, com o relatório de
      qualidade (docs/relatorio_qualidade.md).
    depends_on:
      - source('gold', 'regras_harmonizacao_canonicas')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "Squad e banca (transparência do tratamento)", leitura: "export/gold.json ou banco, papel observatorio_leitura"}

  - name: fila_intervencao
    label: "ETL reverso: fila de intervenção (coordenação e DEG)"
    type: application
    maturity: medium
    description: >
      Cursos em RETENÇÃO CRÍTICA levados a operacional.fila_intervencao
      (src/etl_reverso/fila_intervencao.py). A coordenação a abre na tela "Fila de Intervenção" do
      painel (ou em src/etl_reverso/coordenacao.py) e registra responsável, plano de ação e status; o
      DEG acompanha os cursos sem plano e se os que tiveram plano saíram da fila.
    depends_on:
      - ref('painel_cursos_criticos')
      - ref('metricas_definicoes')
    owner:
      name: Squad Observatório UnB
    meta:
      consumidor: "Coordenações de curso e DEG"
      leitura: "papel coordenacao_academica (grava só o andamento)"
      # A tabela operacional que o consumidor lê, gravada fora do dbt pelo ETL reverso.
      tabelas_fora_do_dbt: [operacional.fila_intervencao]

  - name: lago_delta
    label: "Lago analítico em Delta Lake (Parquet)"
    type: analysis
    maturity: medium
    description: >
      Silver 3NF (sem discentes) e star schema da gold em Delta Lake, em data/lake/lote/
      (src/db/exportar_lago.py, ADR 0024), lido por DuckDB, Spark, Polars ou pandas sem o banco.
    depends_on:
      - source('silver', 'cursos')
      - source('silver', 'estruturas_curriculares')
      - source('silver', 'movimentacoes_vinculos')
      - source('gold', 'fato_retencao_curso')
      - source('gold', 'dim_curso')
      - source('gold', 'dim_campus')
    owner:
      name: Squad Observatório UnB
    meta: {consumidor: "Análise exploratória fora do banco (DuckDB, Spark, Polars)", leitura: "arquivos em data/lake/, na máquina ou runner que rodou o pipeline"}
