version: 2

# A camada de consumo tem contrato de esquema (nomes e tipos das colunas) nas tabelas que o painel
# lê, volume esperado e faixas de valor. Testes de distribuição e de domínio em tests/.

models:
  - name: dim_curso
    description: >
      Dimensão de variação lenta (SCD tipo 2, ADR 0028). Grão: uma linha por versão dos atributos
      de classificação de um curso canônico. A versão atual tem is_atual. Histórico em
      snap_atributos_curso; vigência e integridade testadas em tests/scd_dim_curso_*.sql.
    data_tests:
      # Conta só as versões atuais: as fechadas crescem com o histórico e não indicam carga ruim.
      - volume_entre:
          arguments: {minimo: 80, maximo: 200}
          config:
            where: "is_atual"
    columns:
      - name: sk_curso
        description: md5 do nome canônico com o início da vigência. Uma por versão.
        data_tests: [unique, not_null]
      - name: nome_curso
        description: Chave natural. Repete entre versões; a versão é (nome_curso, vigente_de).
        data_tests: [not_null]
      - name: categoria_grau
        data_tests:
          - accepted_values:
              arguments:
                values: ["BACHARELADO", "LICENCIATURA", "MISTO"]
      - name: vigente_de
        description: Início da versão. A primeira de cada curso vale desde 21/04/1962 (fundação da UnB).
        data_tests: [not_null]
      - name: vigente_ate
        description: Fim da versão, a execução que observou a mudança. Nulo na versão atual.
      - name: is_atual
        description: Versão vigente hoje. Os fatos apontam para ela.
        data_tests: [not_null]

  - name: dim_campus
    description: Campi da UnB e MULTICAMPUS.
    columns:
      - name: sk_campus
        data_tests: [unique, not_null]
      - name: campus
        data_tests: [unique, not_null]

  - name: fct_retencao_curso
    description: >
      Grão: um registro por curso canônico, agregando as coortes maduras (ingresso até o último ano
      da base menos 8). Mesmas regras de gold.fato_retencao_curso, com a qual é reconciliada
      (tests/reconcilia_fato_retencao_com_a_gold.sql).
    config:
      contract:
        enforced: true
    data_tests:
      - volume_entre:
          arguments: {minimo: 60, maximo: 150}
    columns:
      - name: sk_curso
        data_type: text
        description: Chave do grão.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_curso')
                field: sk_curso
      - name: sk_campus
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campus')
                field: sk_campus
      - name: total_ingressantes
        data_type: bigint
      - name: total_formados
        data_type: bigint
      - name: total_evadidos
        data_type: bigint
      - name: total_ainda_ativos
        data_type: bigint
      - name: taxa_formatura_pct
        data_type: numeric
        data_tests:
          - entre:
              arguments: {minimo: 0, maximo: 100}
      - name: taxa_evasao_pct
        data_type: numeric
        data_tests:
          - entre:
              arguments: {minimo: 0, maximo: 100}
      - name: formados_tempo_ideal_pct
        data_type: numeric
        data_tests:
          - entre:
              arguments: {minimo: 0, maximo: 100}
      - name: atraso_medio_semestres
        data_type: numeric
        description: Pode ser negativo (formados antes do prazo ideal), mas não abaixo do prazo mínimo possível.
        data_tests:
          - entre:
              arguments: {minimo: -6, maximo: 20}
      - name: indice_retencao_critica
        data_type: numeric
        data_tests:
          - not_null
          - entre:
              arguments: {minimo: 0, maximo: 100}
      - name: classificacao_retencao
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["RETENÇÃO CRÍTICA", "RETENÇÃO ALTA", "RETENÇÃO MÉDIA", "RETENÇÃO BAIXA"]

  - name: painel_cursos_criticos
    description: >
      Tabela de consumo do painel: cursos terminais ordenados pelo Índice de Retenção Crítica,
      a resposta à pergunta de gestão da E1.
    config:
      contract:
        enforced: true
    data_tests:
      - volume_entre:
          arguments: {minimo: 60, maximo: 150}
    columns:
      - name: posicao
        data_type: bigint
        description: 1 é o curso mais crítico. Empates no IRC dividem a posição.
        data_tests: [not_null]
      - name: nome_curso
        data_type: text
        data_tests: [unique, not_null]
      - name: campus
        data_type: text
      - name: area_conhecimento
        data_type: text
      - name: categoria_grau
        data_type: text
      - name: classificacao_retencao
        data_type: text
      - name: indice_retencao_critica
        data_type: numeric
      - name: taxa_evasao_pct
        data_type: numeric
      - name: atraso_medio_semestres
        data_type: numeric
      - name: taxa_formatura_pct
        data_type: numeric
      - name: formados_tempo_ideal_pct
        data_type: numeric
      - name: total_ingressantes
        data_type: bigint
      - name: total_formados
        data_type: bigint
      - name: total_evadidos
        data_type: bigint
